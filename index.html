<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krytex Bot • Legal</title>

  <style>
    :root {
      --bg: #0b0d12;
      --glass: rgba(255,255,255,0.08);
      --accent: #6cf2c2;
      --text: #e6e9ef;
      --muted: #9aa4b2;
      --blur: blur(14px);
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #12172e, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 2rem;
      display: grid;
      gap: 1.8rem;
      z-index: 1;
      animation: fadeUp 1s ease;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 0;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      animation: glow 3s ease-in-out infinite;
    }

    p {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      perspective: 1000px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: var(--blur);
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      transform-style: preserve-3d;
      transition: transform .15s ease, box-shadow .3s ease;
    }

    .card:hover {
      box-shadow: 0 35px 80px rgba(0,0,0,.6);
    }

    .card span {
      font-size: 2.1rem;
      display: block;
      margin-bottom: .6rem;
      transform: translateZ(30px);
    }

    .contact {
      background: var(--glass);
      backdrop-filter: var(--blur);
      border-radius: 18px;
      padding: 1.8rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .contact h3 {
      margin-top: 0;
      color: var(--accent);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .devs {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%,100% { text-shadow: 0 0 12px rgba(108,242,194,.25); }
      50% { text-shadow: 0 0 26px rgba(108,242,194,.6); }
    }

    /* 📱 Mobile */
    @media (max-width: 600px) {
      .container { padding: 1.5rem 1rem; }
      .card { padding: 1.6rem; }
    }
  </style>
</head>

<body>
  <!-- Particle Canvas -->
  <canvas id="particles"></canvas>

  <div class="container">
    <h1>Krytex Bot — Legal</h1>
    <p>Official legal information for Krytex Bot</p>

    <div class="cards">
      <a class="card tilt" href="https://krytex-dev.github.io/Krytex/TERMS.html" target="_blank">
        <span>📜</span>
        <h3>Terms of Service</h3>
        <p>Rules & usage guidelines</p>
      </a>

      <a class="card tilt" href="https://krytex-dev.github.io/Krytex/PRIVACY.html" target="_blank">
        <span>🔐</span>
        <h3>Privacy Policy</h3>
        <p>How we handle data</p>
      </a>
    </div>

    <div class="contact">
      <h3>📞 Contact</h3>
      <p>
        Email: <a href="mailto:krytex.devs@gamil.com">krytex.devs@gamil.com</a><br>
        Support Server:
        <a href="https://discord.gg/nQxbZDq5uc" target="_blank">discord.gg/krytex</a>
      </p>

      <div class="devs">
        Developed by <strong>Haswanth</strong>, <strong>Vikky</strong> & <strong>Power</strong>
      </div>
    </div>

    <footer>© 2026 Krytex Bot</footer>
  </div>

  <!-- 🌌 Particles -->
  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3
      });
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "rgba(108,242,194,0.6)";
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>

  <!-- 🎴 3D Tilt -->
  <script>
    if (!("ontouchstart" in window)) {
      document.querySelectorAll(".tilt").forEach(card => {
        card.addEventListener("mousemove", e => {
          const r = card.getBoundingClientRect();
          const x = e.clientX - r.left;
          const y = e.clientY - r.top;
          const rx = ((y / r.height) - 0.5) * -12;
          const ry = ((x / r.width) - 0.5) * 12;
          card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "rotateX(0) rotateY(0)";
        });
      });
    }
  </script>
</body>
</html>
